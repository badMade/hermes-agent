name: Self-Heal Compute Schedule

on:
  workflow_dispatch:
  schedule:
    # Run once a week on Sunday at 1 AM to recalculate the schedule for the week.
    - cron: '0 1 * * 0'

concurrency:
  group: compute-schedule-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  compute-schedule:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8

      - name: Run compute_schedule.py
        id: compute_schedule
        run: |
          python3 scripts/compute_schedule.py
          if ! git diff --quiet || ! git diff --staged --quiet; then
            echo "schedule_changed=true" >> $GITHUB_OUTPUT
          else
            echo "schedule_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.compute_schedule.outputs.schedule_changed == 'true'
        uses: peter-evans/create-pull-request@67ccf781d68cd99b580ae25a5c18a1cc84ffff1f # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update self-heal schedule based on telemetry"
          branch: selfheal-schedule-update-${{ github.run_id }}
          title: "[Self-Heal Schedule] Update cadence"
          body: |
            This PR was generated by the Self-Heal Coding Agent.

            Trigger: ${{ github.event_name }}

            It recalculates the optimal frequency of the Self-Heal schedule based on telemetry.

            Link to chat: [Original Prompt/Chat Reference]
          labels: "automation, self-heal"
