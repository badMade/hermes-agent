name: Compute Self-Heal Schedule

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  compute_schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8

      - name: Setup Python
        run: uv python install

      - name: Compute new schedule
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/compute_schedule.py

      - name: Create PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[Self-Heal Schedule] Update cadence"
          branch: selfheal-schedule-update
          delete-branch: true
          title: "[Self-Heal Schedule] Update cadence"
          body: "Updates the self-heal schedule based on recent telemetry."
          labels: automation,self-heal-schedule
