name: Compute Self-Heal Schedule

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

jobs:
  compute-schedule:
    name: Compute and Update Schedule
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8
        with:
          version: "latest"
          enable-cache: true

      - name: Run Compute Schedule
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv pip install ruamel.yaml
          uv run scripts/compute_schedule.py

      - name: Create PR if modified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            BRANCH="schedule-update-$(date +%s)"
            git checkout -b "$BRANCH"
            git commit -a -m "[Self-Heal Schedule] Update cadence"
            git push origin "$BRANCH"
            gh pr create \
              --title "[Self-Heal Schedule] Update cadence" \
              --body "Automated update to self-heal schedule based on telemetry." \
              --head "$BRANCH"
          else
            echo "No changes to schedule."
          fi
