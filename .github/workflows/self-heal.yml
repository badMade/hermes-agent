name: Self-Heal Repair

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Tests", "Lint"]
    types:
      - completed
  schedule:
    # Note: We rely on the schedule computed and injected by compute-schedule.yml.
    # Fallback to daily if unparsed/unavailable.
    - cron: '0 2 * * *'

concurrency:
  group: selfheal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  repair:
    # Run if triggered manually, OR if a CI workflow failed, OR on schedule (but only on default branch)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8

      - name: Gate Check - Exclude selfheal branches
        if: startsWith(github.ref, 'refs/heads/selfheal-')
        run: |
          echo "Already on a selfheal branch, skipping to prevent loops."
          exit 0

      - name: Gate Check - Ensure no open self-heal PR exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh pr list --label "self-heal" --state open --json number -q 'length')
          if [ "$count" -gt 0 ]; then
            echo "An open self-heal PR already exists. Exiting."
            exit 0
          fi

      - name: Pre-repair Healthcheck
        id: pre_healthcheck
        run: |
          if ./scripts/healthcheck.sh; then
            echo "healthcheck_failed=false" >> $GITHUB_OUTPUT
          else
            echo "healthcheck_failed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run Self-Heal
        id: self_heal
        run: |
          if python3 scripts/self_heal.py; then
            echo "fix_applied=true" >> $GITHUB_OUTPUT
          else
            echo "fix_applied=false" >> $GITHUB_OUTPUT
            # If it failed to fix anything but pre_healthcheck also failed, fail the workflow.
            if [ "${{ steps.pre_healthcheck.outputs.healthcheck_failed }}" = "true" ]; then
              echo "Self-heal could not resolve the failure."
              exit 1
            fi
          fi

      - name: Create Pull Request
        if: steps.self_heal.outputs.fix_applied == 'true'
        uses: peter-evans/create-pull-request@67ccf781d68cd99b580ae25a5c18a1cc84ffff1f # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Automated Self-Heal Repair"
          branch: selfheal-repair-${{ github.run_id }}
          title: "[Self-Heal] Reactive CI Fix"
          body: |
            This PR was generated by the Self-Heal Coding Agent.

            Trigger: ${{ github.event_name }}

            It applied fixes for dependency lockfiles or formatting/linting issues to resolve drift.

            Please review the checklist in SELF_HEAL_SETUP.md:
            - [ ] No secrets or high-entropy patterns are in the diff.
            - [ ] Modifications are confined to allowed paths (e.g., lockfiles, formats).
            - [ ] CI workflow logic remains intact.
            - [ ] Tests successfully passed on the new branch.

            Link to chat: [Original Prompt/Chat Reference]
          labels: "automation, self-heal"
