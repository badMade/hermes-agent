name: Self-Heal Pipeline

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

jobs:
  self-heal:
    name: Run Self-Heal Repair
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
    timeout-minutes: 30
    concurrency:
      group: selfheal-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8
        with:
          version: "latest"
          enable-cache: true

      - name: Prevent loops
        run: |
          if [[ "${{ github.ref }}" == refs/heads/selfheal-* ]]; then
            echo "Already on a selfheal branch, skipping."
            exit 0
          fi

      - name: Run Healthcheck
        id: healthcheck
        run: |
          if scripts/healthcheck.sh; then
            echo "Healthcheck passed, no repair needed."
            echo "needed=false" >> $GITHUB_OUTPUT
          else
            echo "Healthcheck failed, proceeding to repair."
            echo "needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run Repair Script
        if: steps.healthcheck.outputs.needed == 'true'
        run: scripts/self_heal.py

      - name: Validate diff
        if: steps.healthcheck.outputs.needed == 'true'
        run: |
          # Gate: ensure diff only touches allowed paths
          forbidden=$(git diff --name-only | grep -E "^(.github/workflows/|scripts/|migrations/)" || true)
          if [ -n "$forbidden" ]; then
            echo "Forbidden files modified: $forbidden"
            exit 1
          fi

      - name: Create PR
        if: steps.healthcheck.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE=""
          if [ "${{ github.event_name }}" == "schedule" ]; then
            TITLE="[Self-Heal Scheduled] Drift fixes"
          elif [ "${{ github.event_name }}" == "workflow_run" ]; then
            TITLE="[Self-Heal Reactive] CI fix"
          else
            TITLE="[Self-Heal Manual] Repair"
          fi

          # Check for open PRs
          OPEN_PR=$(gh pr list --state open --label "self-heal" --json number -q '.[0].number')
          if [ -n "$OPEN_PR" ]; then
            echo "There is already an open self-heal PR (#$OPEN_PR), skipping creation."
            exit 0
          fi

          BRANCH="selfheal-$(date +%s)"
          git checkout -b "$BRANCH"
          git commit -a -m "$TITLE"
          git push origin "$BRANCH"

          gh pr create \
            --title "$TITLE" \
            --body "Trigger: ${{ github.event_name }}. Generated by self-heal pipeline. See chat link: (Insert chat link)" \
            --label "automation,self-heal" \
            --head "$BRANCH"
